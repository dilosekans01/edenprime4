name: Release Eden (Windows + Linux)

# Push a tag like v0.4.2 to build Windows x64 and Linux x86_64 on GitHub's runners and
# publish them as a GitHub Release. Nothing is built or uploaded by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    uses: ./.github/workflows/build-windows.yml

  linux:
    name: Linux x86_64
    uses: ./.github/workflows/build-linux.yml

  release:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          (cd artifacts/eden-kledd-windows && zip -qr "../../release/eden-kledd-${tag}-windows-x86_64.zip" .)
          cp artifacts/eden-kledd-linux-x86_64/eden-kledd-linux-x86_64.tar.gz "release/eden-kledd-${tag}-linux-x86_64.tar.gz"
          cp artifacts/eden-kledd-linux-appimage/eden-kledd-x86_64.AppImage "release/eden-kledd-${tag}-linux-x86_64.AppImage"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eden-kledd ${{ github.ref_name }}
          files: release/*
          body: |
            Metroid Prime 4: Beyond cutscene sync and texture upload fixes, on top of v0.4.2.

            - Real-time cutscenes stay in sync. When the game runs below its usual frame rate, the sound now slows down with it instead of running ahead, so voices stay on the characters' lips (for example in the Nora Armstrong scene). The slowdown keeps the original pitch, and at full speed the sound is untouched.
            - When the game falls behind for a moment, the sound is muted for those frames instead of pausing, so the sound keeps its place after a hitch.
            - Camera cuts and scene changes stutter much less. GPU-decoded (ASTC) textures no longer make the emulator wait for the whole GPU to go idle after each one, which cost 30-360 ms per texture. In testing the worst camera-cut frame went from 843 ms to 486 ms.
            - Texture pool updates are unswizzled on up to 8 threads, and pool uploads use a staging reserve that is set up at start, so a new area no longer waits on fresh memory. This uses about 500 MB more RAM.
            - The long-frame log now also reports where the time went (new images, uploads, the slowest upload and its steps).
            - Everything from v0.4.2: the texture pool fix, Discord Rich Presence and the new default settings. Everything from v0.4 and v0.3: the pool write watch, and the audio hang fix.

            Known: one cutscene still runs at about 42-44 fps. It is limited by the emulated CPU, not by the GPU or the resolution, and is being looked into.

            If you see broken shadows at some camera angles, turn off the Level of Detail mod if you use it.

            Windows: unzip and run eden.exe. Linux: run the AppImage (built on Debian 13, works on SteamOS) or unpack the tarball.
