name: Release Eden (Windows + Linux)

# Push a tag like v0.4.2 to build Windows x64 and Linux x86_64 on GitHub's runners and
# publish them as a GitHub Release. Nothing is built or uploaded by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    uses: ./.github/workflows/build-windows.yml

  linux:
    name: Linux x86_64
    uses: ./.github/workflows/build-linux.yml

  release:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          (cd artifacts/eden-kledd-windows && zip -qr "../../release/eden-kledd-${tag}-windows-x86_64.zip" .)
          cp artifacts/eden-kledd-linux-x86_64/eden-kledd-linux-x86_64.tar.gz "release/eden-kledd-${tag}-linux-x86_64.tar.gz"
          cp artifacts/eden-kledd-linux-appimage/eden-kledd-x86_64.AppImage "release/eden-kledd-${tag}-linux-x86_64.AppImage"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eden-kledd ${{ github.ref_name }}
          files: release/*
          body: |
            Metroid Prime 4: Beyond texture pool fix, Discord Rich Presence and new default settings, on top of the v0.4 stutter fix, the v0.3 audio hang fix and the v0.2 scan fix.

            - A texture pool is no longer uploaded in full twice when the game creates it. The write watch used to attach only after the first full upload and then force a second one; it now attaches at the first upload.
            - Entering a new area costs far less. Only the parts of a pool the game has mapped are read, the rest is filled with zeros on the GPU, and the remaining tiles arrive as the game streams them. No first upload of a pool took more than 43 ms in testing at 2X, down from up to 2.7 s for a full set on slower machines.
            - The texture cache garbage collector gives a pool that a menu hides for a moment about 10 seconds to be drawn again, as long as texture memory is below the critical budget. Above it, old pools make room right away.
            - Discord Rich Presence is built in and on by default: it shows the game's title and play time, with the official icon for Metroid Prime 4. Turn it off under Configure > Web if you don't want your game shown on your profile.
            - New default settings: 2X resolution, ScaleForce, SMAA, Mailbox vsync, Aggressive VRAM usage, GPU video decoding, asynchronous shaders, buffer history on, reactive flushing off, and the long-frame log on. Settings you changed yourself are kept. 2X is demanding: on a slower GPU, lower it under Graphics.
            - Everything from v0.4: the pools stay write-protected in 16-slice groups and only the groups the game touched are uploaded, which fixed the one-second freezes every few seconds and the 6 fps spot in Volt Forge.
            - Everything from v0.3: audio no longer buzzes when the game stalls while loading, the sound output never replays stale buffer memory, the sleep on every file read while a video decoder is open is gone, and the upstream async shader revert (PR 4512) and composer buffer release (PR 4548) are carried over.

            If you see broken shadows at some camera angles, turn off the Level of Detail mod if you use it.

            Windows: unzip and run eden.exe. Linux: run the AppImage (built on Debian 13, works on SteamOS) or unpack the tarball.
