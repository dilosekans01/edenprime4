name: Release Eden (Windows + Linux)

# Push a tag like v0.4.2 to build Windows x64 and Linux x86_64 on GitHub's runners and
# publish them as a GitHub Release. Nothing is built or uploaded by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    uses: ./.github/workflows/build-windows.yml

  linux:
    name: Linux x86_64
    uses: ./.github/workflows/build-linux.yml

  release:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          (cd artifacts/eden-kledd-windows && zip -qr "../../release/eden-kledd-${tag}-windows-x86_64.zip" .)
          cp artifacts/eden-kledd-linux-x86_64/eden-kledd-linux-x86_64.tar.gz "release/eden-kledd-${tag}-linux-x86_64.tar.gz"
          cp artifacts/eden-kledd-linux-appimage/eden-kledd-x86_64.AppImage "release/eden-kledd-${tag}-linux-x86_64.AppImage"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eden-kledd ${{ github.ref_name }}
          files: release/*
          body: |
            Metroid Prime 4: Beyond cutscene frame rate fix, on top of v0.5.

            - Real-time cutscenes that dropped to 42-44 fps now run about 9-10 fps faster. Twice per frame the game asks the GPU to wait for a sync counter, and Eden answered by waiting for the graphics card to finish all queued work, about 7 ms each time. In testing the counter was always already reached, so Eden now skips the wait in that case and otherwise waits only for that counter.
            - On CPUs with performance and efficiency cores (Intel 12th gen and later), the emulated CPU cores, the GPU thread and the other timing-critical threads are now kept on the performance cores on Windows. This used to work on Android only.
            - The log now shows, every 2 seconds, how busy each emulation thread is and where the GPU thread waits. It costs a few percent of one CPU core.
            - Everything from v0.5: cutscene audio that slows down with the game at the original pitch, faster camera cuts, and the parallel texture pool uploads.

            Known: one cutscene still dips to about 50 fps. There the GPU thread itself has about twice its usual work, which is being looked into.

            If you see broken shadows at some camera angles, turn off the Level of Detail mod if you use it.

            Windows: unzip and run eden.exe. Linux: run the AppImage (built on Debian 13, works on SteamOS) or unpack the tarball.
