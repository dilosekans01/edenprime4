name: Build Eden (Linux)

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian 13 has glibc 2.41, same as SteamOS, so the build also runs on the Steam Deck
    container: debian:13
    timeout-minutes: 340
    steps:
      - name: Install dependencies (from docs/Deps.md, Debian 13)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip zip xz-utils patch python3 file \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev libhidapi-dev libpulse-dev \
            libtool libudev-dev libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxext-dev libxkbcommon-x11-0 mesa-common-dev nasm \
            ninja-build qt6-base-private-dev catch2 libfmt-dev liblz4-dev nlohmann-json3-dev \
            libzstd-dev libssl-dev libavfilter-dev libavcodec-dev libswscale-dev pkg-config \
            zlib1g-dev libva-dev libvdpau-dev qt6-tools-dev qt6-charts-dev libvulkan-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev libxbyak-dev libboost-dev \
            libboost-fiber-dev libboost-context-dev libsdl3-dev libopus-dev libasound2t64 \
            vulkan-utility-libraries-dev qmake6 qt6-qpa-plugins qt6-wayland libqt6svg6 \
            libfuse2t64 squashfs-tools desktop-file-utils librsvg2-bin

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set +e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYUZU_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr -DUSE_DISCORD_PRESENCE=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON > configure.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E -A6 'CMake Error|Could NOT|not found' configure.log | head -40)
            [ -z "$msg" ] && msg=$(tail -40 configure.log)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=Configure failed::$msg"
            exit $code
          fi

      - name: Build
        run: |
          set +e
          cmake --build build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E -B2 -A4 'error:|Error ' build.log | head -40)
            [ -z "$msg" ] && msg=$(tail -40 build.log)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=Build failed::$msg"
            exit $code
          fi

      - name: Package
        run: |
          mkdir -p out
          cp build/bin/eden* out/ 2>/dev/null || cp -r build/bin/* out/
          tar -C out -czf eden-kledd-linux-x86_64.tar.gz .

      # appimagetool (linuxdeploy's continuous build) needs a PNG or XPM icon at the top of the
      # AppDir to make .DirIcon; the repo only ships an SVG, so one is rendered here.
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake6
          OUTPUT: eden-kledd-x86_64.AppImage
        run: |
          set +e
          {
            set -x
            DESTDIR="$PWD/AppDir" cmake --install build &&
            mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps &&
            rsvg-convert -w 256 -h 256 dist/dev.eden_emu.eden.svg \
              -o AppDir/usr/share/icons/hicolor/256x256/apps/dev.eden_emu.eden.png &&
            cp AppDir/usr/share/icons/hicolor/256x256/apps/dev.eden_emu.eden.png AppDir/ &&
            curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage &&
            curl -fsSLo linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage &&
            chmod +x linuxdeploy linuxdeploy-plugin-qt &&
            ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
              -e AppDir/usr/bin/eden \
              -d AppDir/usr/share/applications/dev.eden_emu.eden.desktop \
              -i AppDir/usr/share/icons/hicolor/256x256/apps/dev.eden_emu.eden.png \
              -i AppDir/usr/share/icons/hicolor/scalable/apps/dev.eden_emu.eden.svg
          } > appimage.log 2>&1
          code=$?
          if [ $code -ne 0 ] || [ ! -f eden-kledd-x86_64.AppImage ]; then
            msg=$(grep -E -i -B2 -A3 'error|failed|not found' appimage.log | tail -40)
            [ -z "$msg" ] && msg=$(tail -40 appimage.log)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=AppImage failed::$msg"
            exit 1
          fi
          ls -la eden-kledd-x86_64.AppImage
          need=$(find AppDir -type f \( -name '*.so*' -o -path '*/bin/*' \) -exec objdump -T {} + 2>/dev/null | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "Newest glibc needed: $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.41 | sort -V | tail -1)" != GLIBC_2.41 ]; then
            echo "::error title=glibc too new::AppImage needs $need, SteamOS has GLIBC_2.41"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eden-kledd-linux-x86_64
          path: eden-kledd-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: eden-kledd-linux-appimage
          path: eden-kledd-x86_64.AppImage
